<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>영상 심의</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>영상 심의</h1>
  </header>

  <main class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <strong>영상 목록</strong>

        <button id="loadBtn" class="btn mini">파일 불러오기</button>
        <button id="folderBtn" class="btn mini">폴더 불러오기</button>
        <input id="fileInput" type="file" accept="video/*" multiple hidden />
        <input id="folderInput" type="file" accept="video/*" webkitdirectory directory multiple hidden />

        <div class="toggle-row" style="margin-top:8px;">
          <label style="font-size:12px; cursor:pointer;">
            <input id="useMultipassToggle" type="checkbox" />
            multi
          </label>
        </div>

        <span id="videoCount" class="muted right-count">0개</span>
      </div>

      <ul id="videoList" class="video-list"></ul>
    </aside>

    <!-- 비디오 플레이어 -->
    <section class="workspace">
      <div id="emptyGuide" class="empty-state">
        <p>왼쪽에서 영상을 선택하면 여기에서 재생됩니다.</p>
      </div>

      <video id="player" class="video-player" controls></video>

      <!-- 영상 제목 -->
      <div id="videoTitle" class="video-title"></div>

      <!-- 영상 설명(빈칸, 나중에 Gemini API 결과 들어갈 곳) -->
      <div id="videoDesc" class="video-desc">
      </div>
    </section>

    <!-- 오른쪽 절반 영역 -->
    <section class="result-panel">

      <!-- 평가결과 -->
      <div class="eval-result">
        <h2 class="panel-title">평가결과</h2>

        <table id="resultTable" class="eval-table">
          <colgroup>
            <col style="width: 10%;">
            <col style="width: 10%;">
            <col style="width: 60%;">
            <col style="width: 20%;">
          </colgroup>

          <thead>
            <tr>
              <th>기준</th>
              <th>점수</th>
              <th>근거</th>
              <th>피드백</th>
            </tr>
          </thead>

          <tbody>
            <!-- 2~8행 (Gemini API가 채워줄 자리) -->
            <!-- 총 7행 -->
            <tr><td>주제</td><td></td><td></td><td></td></tr>
            <tr><td>선정성</td><td></td><td></td><td></td></tr>
            <tr><td>폭력성</td><td></td><td></td><td></td></tr>
            <tr><td>공포</td><td></td><td></td><td></td></tr>
            <tr><td>약물</td><td></td><td></td><td></td></tr>
            <tr><td>언어</td><td></td><td></td><td></td></tr>
            <tr><td>모방위험</td><td></td><td></td><td></td></tr>
          </tbody>
        </table>
      </div>

      <!-- 평가기준 -->
      <div class="eval-standard">
        <h2 class="panel-title">평가기준</h2>

        <!-- 지금은 빈 칸만 보여주기 -->
        <div class="standard-box">
          <!-- 나중에 내용 들어감 -->
        </div>
      </div>

    </section>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
