<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>영상 심의 보조 인터페이스 (Prototype)</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:," />
</head>
<body>
  <main class="container">
    <!-- 0: Video input + preview -->
    <section class="video-section">
      <div class="video-input-row">
        <label for="video-file">비디오 파일 선택</label>
        <input type="file" id="video-file" accept="video/*" />
      </div>
      <div class="box video-preview" aria-label="비디오 미리보기">
        <video id="video-player" controls preload="metadata"></video>
      </div>
    </section>

    <!-- 1: Requirements input (used to adjust predefined prompts later) -->
    <section id="prompt-box" class="box prompt" aria-label="요구사항 입력">
      <label for="requirements-input" class="sr-only">요구사항 입력</label>
      <textarea id="requirements-input" placeholder="요구사항을 입력하세요. 입력이 없으면 기본 프롬프트가 사용됩니다" spellcheck="false"></textarea>
    </section>

    <!-- 2~8: Category boxes -->
    <section class="categories" aria-label="심의 카테고리">
      <button class="box category" data-key="summary" id="cat-1" aria-label="요약">
        <span>요약</span>
      </button>
      <button class="box category" data-key="topic" id="cat-2" aria-label="주제">
        <span>주제</span>
      </button>
      <button class="box category" data-key="sexuality" id="cat-3" aria-label="선정성">
        <span>선정성</span>
      </button>
      <button class="box category" data-key="violence" id="cat-4" aria-label="폭력성">
        <span>폭력성</span>
      </button>
      <button class="box category" data-key="dialogue" id="cat-5" aria-label="대사">
        <span>대사</span>
      </button>
      <button class="box category" data-key="horror" id="cat-6" aria-label="공포">
        <span>공포</span>
      </button>
      <button class="box category" data-key="drugs" id="cat-7" aria-label="약물">
        <span>약물</span>
      </button>
      <button class="box category" data-key="imitable" id="cat-8" aria-label="모방위험">
        <span>모방위험</span>
      </button>
    </section>

    <!-- 9: Output area -->
    <section id="output-box" class="box output" aria-live="polite" aria-label="AI 응답 영역">
      <div id="output-content">카테고리를 선택하면 이 영역에 AI 응답이 표시됩니다.</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
